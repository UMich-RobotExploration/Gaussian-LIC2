lidar0:
    topic: /ouster/points  # as ouster-ros publishes it (point_cloud_frame: os_lidar, organized); bags with only /ouster/lidar_packets are decoded
    is_livox: false
    Extrinsics:  # lidar to imu (os_lidar -> os_imu, from the Ouster factory metadata)
        Trans: [0.002441, 0.009725, 0.040291]
        Rot: [-1,  0,  0,
               0, -1,  0,
               0,  0,  1]
num_lidars: 1
lidar_timestamp_end: false  # if the timestamp of a lidar scan is set at the end of the scan

### FeatureExtraction ###
VLP16:  # Ouster OS-DOME-128 in 2048x10 mode (VLP16 just denotes rotating lidar)
    N_SCAN: 128  # rows of the organized cloud; 64 if the driver runs with v_reduction:=2
    Horizon_SCAN: 2048
    edge_threshold: 1.0
    surf_threshold: 0.1
    odometry_surface_leaf_size: 0.4
    min_distance: 1.0
    max_distance: 200.0

### Odometry ###
use_corner_feature: false
current_scan_param:
    corner_leaf_size: 0.2
    surface_leaf_size: 0.4
    edge_min_valid_num: 10
    surf_min_valid_num: 100
    correspondence_downsample: 2
keyframe_strategy:
    angle_degree: 10
    dist_meter: 1.0
    time_second: 10
map_param:
    keyframe_search_radius: 50.0
    keyframe_search_time: 10.0
    keyframe_density: 2
    cloud_reserved_time: -1  # [s]
